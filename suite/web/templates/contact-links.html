{% macro contact_links(site) %}
  <div class="contact-links">
    {% if site.whatsapp %}<a class="button primary" href="{{ site.whatsapp_url }}" target="_blank" rel="noopener noreferrer">Conversar pelo WhatsApp <span aria-hidden="true">↗</span></a>{% endif %}
    {% if site.email %}<a class="button" href="{{ site.email_url }}">{{ site.email }}</a>{% endif %}
    {% if site.website %}<a class="button" href="{{ site.website }}" target="_blank" rel="noopener noreferrer">Visitar o site <span aria-hidden="true">↗</span></a>{% endif %}
    {% if site.instagram %}<a class="button" href="{{ site.instagram }}" target="_blank" rel="noopener noreferrer">Instagram <span aria-hidden="true">↗</span></a>{% endif %}
    {% if site.youtube %}<a class="button" href="{{ site.youtube }}" target="_blank" rel="noopener noreferrer">YouTube <span aria-hidden="true">↗</span></a>{% endif %}
  </div>
{% endmacro %}
